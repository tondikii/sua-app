services:
  postgres:
    image: postgres:16-alpine
    container_name: atur_perjalanan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aturperjalanan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-aturperjalanan_dev}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aturperjalanan} -d ${POSTGRES_DB:-aturperjalanan_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
